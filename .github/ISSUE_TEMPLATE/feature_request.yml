name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to add or improve?
      description: Describe the feature and how it should work for merchants, customers or developers.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would this be useful?
      description: Who benefits and what it makes possible, for example a new way to sell, less manual work or support for another provider.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case or current limitation
      description: Optional. A concrete example from your store, or what is difficult or impossible today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storefront
        - Cart and checkout
        - Admin
        - Customer account
        - Orders, invoices and refunds
        - Subscriptions and renewals
        - Inventory and shipping
        - API and webhooks
        - Installation and upgrades
        - Theme
        - Existing Module or Extension
        - New Module or Extension
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Module, Extension or provider
      description: Only when the request concerns a specific package or a provider that is not supported yet.
      placeholder: Pterodactyl, Stripe, a new registrar
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to provider documentation or examples from other platforms.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues for this request.
          required: true
