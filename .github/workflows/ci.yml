name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^# DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          php artisan migrate --force

      - name: Pint
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Tests
        run: php artisan test

      - name: Composer audit
        if: matrix.php == '8.3'
        run: composer audit

      - name: NPM audit
        if: matrix.php == '8.3'
        run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^# DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/127.0.0.1:8000/' .env
          php artisan migrate --force
          php artisan agovena:install --no-interaction --name="E2E Owner" --email="e2e-owner@example.test" --password="password" --site-name="Agovena" --locale=en --timezone=UTC --currency=EUR --theme=default --presets=physical,digital,hosting,subscriptions,events
          php e2e/prepare.php

      - name: Browser tests
        run: npx playwright test --project=chromium-ci
        env:
          E2E_BASE_URL: http://127.0.0.1:8000

  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: rootsecret
          MYSQL_DATABASE: agovena_test
          MYSQL_USER: agovena
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=agovena_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=agovena/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

      - name: Fresh migrations
        run: php artisan migrate --force

      # Collision's `artisan test` always injects phpunit.xml. A second
      # --configuration makes Pest warn and exit 1 even when tests pass.
      - name: MariaDB feature tests
        run: |
          set -o pipefail
          mkdir -p storage/logs
          php vendor/bin/pest --configuration=phpunit.mariadb.xml --testsuite=Unit,Feature --log-junit storage/logs/mariadb-junit.xml 2>&1 | tee storage/logs/mariadb-feature.log

      - name: MariaDB upgrade tests
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p storage/logs
          php vendor/bin/pest --configuration=phpunit.mariadb.xml --testsuite=Upgrade --log-junit storage/logs/mariadb-upgrade-junit.xml 2>&1 | tee storage/logs/mariadb-upgrade.log

      - name: MariaDB concurrency tests
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p storage/logs
          php vendor/bin/pest --configuration=phpunit.mariadb.xml --testsuite=Concurrency --log-junit storage/logs/mariadb-concurrency-junit.xml 2>&1 | tee storage/logs/mariadb-concurrency.log

      - name: Annotate MariaDB failures
        if: failure()
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          for path in ("storage/logs/mariadb-junit.xml", "storage/logs/mariadb-upgrade-junit.xml", "storage/logs/mariadb-concurrency-junit.xml"):
              if not os.path.exists(path):
                  continue
              for case in ET.parse(path).iter("testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is None:
                      continue
                  name = f"{case.get('classname', '')}::{case.get('name', '')}"
                  msg = " ".join((node.get("message") or node.text or "failed").split())[:400]
                  print(f"::error title={name}::{msg}")
          for log in ("storage/logs/mariadb-feature.log", "storage/logs/mariadb-upgrade.log", "storage/logs/mariadb-concurrency.log"):
              if os.path.exists(log):
                  print(f"::group::{log}")
                  print(open(log, encoding="utf-8", errors="replace").read()[-8000:])
                  print("::endgroup::")
          PY

      - name: Upload MariaDB test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-junit
          path: |
            storage/logs/mariadb-junit.xml
            storage/logs/mariadb-upgrade-junit.xml
            storage/logs/mariadb-concurrency-junit.xml
            storage/logs/mariadb-feature.log
            storage/logs/mariadb-upgrade.log
            storage/logs/mariadb-concurrency.log
