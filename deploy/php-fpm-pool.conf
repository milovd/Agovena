; Example PHP-FPM pool for a native Agovena install.
; Copy and adapt for your PHP version (php8.3-fpm / php8.4-fpm).
; Do not run FPM as root. Align the user with the queue worker and cron user.

[agovena]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-agovena.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Keep in sync with deploy/nginx.conf client_max_body_size and Apache LimitRequestBody.
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[memory_limit] = 256M

; Application code lives outside the document root; only public/ is web-exposed.
chdir = /var/www/agovena
