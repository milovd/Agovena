; Optional Supervisor program for hosts that do not use systemd.
; Native production does not require Docker. Prefer deploy/systemd/agovena-queue.service
; on systemd distributions.

[program:agovena-queue]
process_name=%(program_name)s
command=/usr/bin/php /var/www/agovena/artisan queue:work --sleep=1 --tries=3 --timeout=60 --backoff=5 --max-time=3600
directory=/var/www/agovena
user=www-data
autostart=true
autorestart=true
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/agovena/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
