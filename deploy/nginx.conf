# Native Nginx + PHP-FPM for Agovena.
# Document root MUST be the public/ directory. Do not expose the application root.
#
# Recommended: Nginx + PHP-FPM + MariaDB.
# Docker is optional; this file does not use container hostnames.
#
# Private files live under storage/app/private (outside the document root) and must
# never be aliased into this vhost. Public media uses public/storage → storage/app/public.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /var/www/agovena/public;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never execute uploaded/public storage as PHP.
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Point this at your php-fpm socket or 127.0.0.1:9000.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}
