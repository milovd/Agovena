# Native Apache vhost for Agovena (AllowOverride + mod_rewrite).
# Document root MUST be public/. Prefer Nginx + PHP-FPM in production.

<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/agovena/public
    LimitRequestBody 20971520

    <Directory /var/www/agovena>
        Require all denied
    </Directory>

    <Directory /var/www/agovena/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(?:json|lock|md|yml|yaml)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/agovena-error.log
    CustomLog ${APACHE_LOG_DIR}/agovena-access.log combined
</VirtualHost>
