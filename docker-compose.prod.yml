# Optional production Compose stack. Native Linux (Nginx/PHP-FPM/MariaDB) is the
# primary self-host path - see deploy/README.md. This file is convenience only.
# Not an OS image and not live-verified on a specific host OS.
# Does not run migrations on start.
#
# Native install does not use this file.
# Optional: docker compose -f docker-compose.prod.yml exec app php artisan agovena:install
# Optional: docker compose -f docker-compose.prod.yml exec app php artisan agovena:upgrade

services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 8

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.fpm
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: agovena
      DB_USERNAME: agovena
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(0);\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.fpm
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_DATABASE: agovena
      DB_USERNAME: agovena
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Queue health is operational (failed jobs + doctor), not an HTTP server.

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.fpm
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_DATABASE: agovena
      DB_USERNAME: agovena
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scheduler health is the heartbeat in Admin → Updates / agovena:doctor.

  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: agovena
      MYSQL_USER: agovena
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - agovena-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - agovena-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agovena-mariadb:
  agovena-redis:
